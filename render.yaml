services:
  - type: web
    name: controlplane-ai
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
      - key: SQLITE_DB_PATH
        value: /data/controlplane.sqlite
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        sync: false
      - key: OPENAI_MODEL
        sync: false
